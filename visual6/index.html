<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>推しビジュ6選｜PLAY ROOM</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="6つのテーマで推しの好きなビジュを選んで、タグ画っぽい1枚を作れるメーカーです。" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="PLAY ROOM">
<meta property="og:title" content="推しビジュ6選｜PLAY ROOM">
<meta property="og:description" content="6つのテーマで推しの好きなビジュを選んで、タグ画っぽい1枚を作れるメーカーです。">
<meta property="og:url" content="https://playroom-lab.github.io/play-room/visual6/">
<meta property="og:image" content="https://playroom-lab.github.io/play-room/assets/ogp/visual6.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@400;600&family=Montserrat:wght@500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* スクラップの写真下ラベル(Canvas)専用の手書きフォント */
@font-face{font-family:"HanaToChoucho";src:url("assets/fonts/hana-sub.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  --bg:#f7f5ed;--ink:#282536;--muted:#625f6d;--line:#d5d1d9;--paper:#fff;
  --pink:#ffd5df;--pink-soft:#ffe7ef;--lime:#dcefa5;--violet:#ded7ff;--sky:#cfe3ff;--berry:#a43e61;
  --shadow:4px 5px 0 var(--ink);
  --font:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --hand:"Klee One","Zen Kaku Gothic New",sans-serif;
  --pv:max(180px,min(calc(100vw - 32px),calc(100vh - 430px),480px));
  --pv:max(180px,min(calc(100vw - 32px),calc(100dvh - 430px),480px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,summary{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #8051bd;outline-offset:2px}
.wrap{width:min(1080px,100% - 32px);margin:0 auto}

.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.nav-brand{font-size:.875rem;font-weight:700;letter-spacing:.045em;color:var(--ink);text-decoration:none}
.nav-back{font-size:.8125rem;color:var(--muted);text-decoration:none}

.head{padding:4px 0 14px}
.room-label{display:inline-block;margin:0 0 10px;padding:3px 10px;background:var(--ink);color:var(--paper);font-size:.8125rem;font-weight:700;letter-spacing:.12em;transform:rotate(-3deg)}
h1{margin:0;font-size:clamp(1.6rem,6.5vw,2.4rem);font-weight:900;line-height:1.25;letter-spacing:.01em}
h1 span{background:linear-gradient(transparent 58%,var(--pink) 58%);padding:0 .1em}
.lead{margin:8px 0 0;color:var(--muted);font-size:.875rem}

.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:5px;box-shadow:var(--shadow);padding:16px}
.card h2{margin:0 0 10px;font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.75rem}
.btn{appearance:none;cursor:pointer;border:1.5px solid var(--ink);border-radius:30px;background:var(--paper);box-shadow:2px 3px 0 var(--ink);padding:9px 16px;font-size:.875rem;font-weight:700;line-height:1.2;min-height:44px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pick{background:var(--pink)}
.btn.next{background:var(--lime)}
.btn.quiet{box-shadow:none;border-color:var(--line);color:var(--muted);font-weight:500;min-height:40px}
.btn:disabled{opacity:.6;cursor:default}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{appearance:none;cursor:pointer;border:1.5px solid var(--ink);border-radius:30px;background:var(--paper);padding:7px 14px;min-height:40px;font-size:.8125rem;font-weight:700;letter-spacing:.04em}
.tag[aria-pressed="true"]{background:var(--ink);color:#fff}

.layout{display:flex;flex-direction:column}
.panel{order:-1;padding-bottom:12px}
.top-card{padding:12px;display:grid;gap:8px}
.top-card h2{margin:0;font-size:.9rem}
.top-card .tags{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px 6px}
.top-card .tags::-webkit-scrollbar{display:none}
.top-card .tag{flex:none}
.top-card .note{margin:0}
.name-input{padding:8px 12px;font-size:.9rem}
.stage{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px 10px;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.pv-wrap{position:relative;width:var(--pv);height:var(--pv);margin:0 auto;background:#fff;border:1.5px solid var(--ink);border-radius:5px;box-shadow:3px 4px 0 var(--ink);overflow:hidden}
#previewCanvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#overlay.is-editing{touch-action:none}
#overlay .hit{fill:transparent;cursor:pointer;outline:none}
#overlay .hit.on.has{cursor:grab}
#overlay .halo{fill:none;stroke:transparent;pointer-events:none}
#overlay .halo.on{stroke:#8051bd;stroke-width:7;stroke-dasharray:22 12}
#overlay .hit:focus-visible{stroke:#8051bd;stroke-width:6}
.stage-bar{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px auto 0;width:min(100%,480px)}
.seg[hidden]{display:none}
.stage-bar{justify-content:flex-end}
.seg{display:flex;flex:1;border:1.5px solid var(--ink);border-radius:30px;overflow:hidden;background:#fff}
.seg-btn{white-space:nowrap;appearance:none;flex:1;border:0;background:transparent;cursor:pointer;padding:7px 2px;min-height:38px;font-size:.72rem;font-weight:700;border-right:1.5px solid var(--ink)}
.seg-btn:last-child{border-right:0}
.seg-btn[aria-pressed="true"]{background:var(--pink)}
.pv-wrap .view-btn{position:absolute;right:8px;bottom:8px;z-index:2}
.view-btn{flex:none;min-height:38px;padding:6px 10px;font-size:.72rem;white-space:nowrap}
.design-hint{display:none}


.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-chip{appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:5px;background:#fff;padding:6px 4px 5px;min-width:0}
.slot-chip .thumb{display:grid;place-items:center;width:100%;aspect-ratio:1/1;background:var(--pink-soft);border-radius:3px;overflow:hidden;font-size:1.4rem;font-weight:700;color:var(--berry)}
.slot-chip .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.slot-chip .nm{font-size:.72rem;font-weight:700;line-height:1.25;text-align:center}
.slot-chip.filled{border-color:var(--ink)}
.slot-chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 4px 0 var(--ink);background:var(--violet)}

.ed-head{margin-bottom:10px}
.ed-eyebrow{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--berry)}
.ed-head h3{margin:0;font-size:1.2rem;font-weight:900;line-height:1.3}
.ed-state{margin:0;font-size:.78rem;color:var(--muted)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}
.ed-zoom{display:flex;align-items:center;gap:8px;margin-top:14px}
.ed-label{font-size:.8125rem;font-weight:700;flex:none}
.step{appearance:none;cursor:pointer;flex:none;width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;font-size:1.2rem;font-weight:700;line-height:1}
.val{flex:none;min-width:3.4em;text-align:right;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:32px;accent-color:#8051bd;margin:0}
.hint{margin:10px 0 0;font-family:var(--hand);font-size:.8125rem;color:var(--muted)}
.when-mouse{display:none}
@media (hover:hover) and (pointer:fine){.when-touch{display:none}.when-mouse{display:inline}}
.fine{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.fine summary{cursor:pointer;font-size:.8125rem;font-weight:700;padding:6px 0}
.fine-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.fine-row label{flex:none;width:2.4em;font-size:.8125rem}
.ed-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}


/* 固定エリア内の編集(写真を入れる・拡大) */
.editor{width:min(100%,480px);margin:8px auto 0}
.ed-title{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;min-width:0}
.ed-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--berry);flex:none}
.ed-title strong{font-size:1rem;font-weight:900;line-height:1.2}
.ed-state{margin-left:auto;font-size:.72rem;color:var(--muted);flex:none}
.editor .ed-actions{display:flex;gap:6px}
.editor .ed-actions .btn{flex:1;min-height:40px;padding:6px 8px;font-size:.78rem;white-space:nowrap}
.editor .ed-zoom{margin-top:8px;gap:6px}
.editor .step{width:32px;height:32px;font-size:1rem}
.editor .val{min-width:3em}
.ed-sliders.off{opacity:.45}
.editor .ed-zoom{margin-top:2px}
.editor .ed-zoom input[type=range]{height:28px}
.editor .ed-label{width:2.4em;flex:none}
.ed-sub{display:flex;gap:10px;align-items:center;margin-top:4px;font-family:var(--hand);font-size:.72rem;color:var(--muted)}
.ed-sub .link{appearance:none;border:0;background:none;cursor:pointer;margin-left:auto;font-size:.75rem;font-weight:700;text-decoration:underline;color:var(--berry);padding:6px 2px;min-height:32px}
.ed-sub .link+.link{margin-left:0}
.ed-sub .link:disabled{opacity:.4}
.name-input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:10px 12px;font-size:1rem;background:#fff}
.note{margin:6px 0 0;font-size:.75rem;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1.5px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-inner{display:flex;align-items:center;gap:12px;width:min(1080px,100%);margin:0 auto}
.progress{flex:none;font-size:.9rem;font-weight:900;padding:4px 12px;background:var(--pink);border:1.5px solid var(--ink);border-radius:30px;white-space:nowrap}
.progress.done{background:var(--lime)}
.save{flex:1;background:var(--ink);color:#fff;font-size:1rem;min-height:48px}
.status{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;max-width:calc(100vw - 32px);padding:8px 16px;background:var(--ink);color:#fff;border-radius:30px;font-size:.8125rem;font-weight:700;pointer-events:none}
.status:empty{display:none}

footer{padding:20px 0 10px;border-top:1px dashed var(--line);text-align:center;color:var(--muted);font-size:.8125rem;margin-top:24px}
footer p{margin:0}
footer .credit{margin-top:4px;font-size:.75rem;letter-spacing:.07em}

.modal{position:fixed;inset:0;z-index:50;background:rgba(40,37,54,.55);display:none;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.sheet{width:min(720px,100%);max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg);border:1.5px solid var(--ink);border-radius:12px 12px 0 0;padding:16px;box-shadow:0 -4px 0 var(--ink)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:1.05rem;font-weight:900}
.close-button{appearance:none;cursor:pointer;border:1.5px solid var(--ink);background:#fff;border-radius:30px;padding:6px 14px;min-height:40px;font-weight:700}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-option{appearance:none;cursor:pointer;padding:0;border:1.5px solid var(--line);border-radius:5px;background:#fff;overflow:hidden;aspect-ratio:3/4}
.photo-option img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.photo-option.is-selected{border-color:var(--ink);box-shadow:3px 4px 0 var(--berry)}
.sheet-foot{margin-top:12px;display:flex;justify-content:center}
.fb{align-items:center;padding:16px}
.fb .sheet{border-radius:5px;box-shadow:var(--shadow);text-align:center;width:min(520px,100%)}
.fb img{max-width:100%;max-height:60vh;max-height:60dvh;border:1.5px solid var(--ink);border-radius:5px}
.fb p{font-size:.85rem;color:var(--muted);margin:8px 0}

@media (max-width:899px){.lead{display:none}.head{padding-bottom:8px}.nav{padding:8px 0}}
@media (min-width:900px){
  :root{--pv:min(520px,calc(100vh - 330px));--pv:min(520px,calc(100dvh - 330px))}
  .layout{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px 32px;align-items:start}
  .stage{display:contents}
  .pv-block{grid-column:1;grid-row:1/3;position:sticky;top:16px}
  .panel{order:0;grid-column:2;grid-row:1;padding-bottom:0}
  .editor{grid-column:2;grid-row:2;width:100%;max-width:none;margin:0;background:#fff;border:1.5px solid var(--ink);border-radius:5px;box-shadow:var(--shadow);padding:16px}
  .pv-wrap,.stage-bar{margin-left:0}
  .top-card .tags{flex-wrap:wrap;overflow:visible}
  .modal{align-items:center}
  .sheet{border-radius:8px;box-shadow:var(--shadow)}
  .photo-grid{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="PLAY ROOM navigation">
    <a class="nav-brand" href="../">PLAY ROOM</a>
    <a class="nav-back" href="../">← ツール一覧</a>
  </nav>
  <header class="head">
    <p class="room-label">04 / PICK SIX</p>
    <h1>推しビジュ<span>6選</span></h1>
    <p class="lead">6つのテーマで好きなビジュを選んで、1枚の画像に。</p>
  </header>

  <div class="layout">
    <div class="stage" id="stage">
      <div class="pv-block">
      <div class="pv-wrap">
        <canvas id="previewCanvas" width="1200" height="1200" aria-label="仕上がりプレビュー"></canvas>
        <svg id="overlay" aria-label="プレビューの写真を調整"></svg>
        <button type="button" class="btn view-btn" id="viewBtn">拡大表示</button>
      </div>
      <p class="design-hint" id="designHint"></p>
      </div>
      <div class="editor" id="editor"></div>
    </div>

    <div class="panel">
      <section class="card top-card" aria-label="推しと名前">
        <h2 id="h-member">推しを選ぶ</h2>
        <div class="tags" id="memberTags"></div>
        <input class="name-input" id="userNameInput" type="text" maxlength="20" placeholder="名前（任意・空欄ならメンバー名）" autocomplete="off" aria-label="名前（任意）" />
        <p class="note">メンバーを切り替えると、選んだ写真はリセットされます。</p>
      </section>
    </div>
  </div>

  <footer>
    <p>MAZZEL・BMSG公式とは関係のない<br>非公式ファンメイドサイトです。</p>
    <p class="credit">PLAY ROOM</p>
  </footer>
</div>

<div class="status" id="status" role="status"></div>
<div class="dock">
  <div class="dock-inner">
    <span class="progress" id="progress">あと6枠</span>
    <button type="button" class="btn save" id="saveBtn">画像を保存する</button>
  </div>
</div>

<div class="modal" id="photoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="modalTitle">写真を選ぶ</h2><button type="button" class="close-button">閉じる</button></div>
    <div class="photo-grid" id="modalPhotoGrid"></div>
    <div class="sheet-foot"><button type="button" class="btn" id="modalUploadBtn">自分の画像をアップロード</button></div>
  </div>
</div>

<div class="modal fb" id="saveFallback" role="dialog" aria-modal="true" aria-label="画像を保存">
  <div class="sheet">
    <p>画像を長押しして保存してください。</p>
    <img id="fallbackImage" alt="保存用の画像" />
    <p><button type="button" class="btn" id="fallbackClose">閉じる</button></p>
  </div>
</div>

<div class="modal fb" id="viewModal" role="dialog" aria-modal="true" aria-label="プレビュー拡大">
  <div class="sheet">
    <img id="viewImage" alt="仕上がりプレビュー" />
    <p><button type="button" class="btn" id="viewClose">閉じる</button></p>
  </div>
</div>

<input type="file" id="uploadInput" accept="image/*" hidden />
<script>
/* 読み込みエラーを画面に出す(原因調査用) */
window.addEventListener("error",function(e){var d=document.getElementById("status");if(d){d.textContent="エラー: "+(e.message||"不明")+(e.lineno?" ("+e.lineno+")":"");d.style.pointerEvents="auto";}});
</script>
<script src="../assets/fast-img.js"></script>
<script src="assets/js/app.js?v=20261009"></script>
</body>
</html>
