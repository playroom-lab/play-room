function finishable(pool,depth,fun,lastGeo,strict=true,unitUsed=false){if(pool.length<=1)return pool.length===0||pool[0].g!=='MAZZEL'||fun||depth>0;if(depth<=0||pool.length>2**depth)return false;const key=[depth,fun,lastGeo,strict,unitUsed,pool.map(x=>x.n).join('|')].join(':');if(finishMemo.has(key))return finishMemo.get(key);for(const {q} of rankQuestions(pool,[])){if((strict&&lastGeo&&geo(q))||(unitUsed&&mazzelUnit(q)))continue;const y=pool.filter(x=>val(q,x)===true),n=pool.filter(x=>val(q,x)===false);if(y.length+n.length!==pool.length)continue;const f=fun||funQuestion(q);if(finishable(y,depth-1,f,geo(q),strict,unitUsed||mazzelUnit(q))&&finishable(n,depth-1,f,geo(q),strict,unitUsed||mazzelUnit(q))){finishMemo.set(key,true);return true}}finishMemo.set(key,false);return false}
function pick(pool,u){const remaining=5-count,fun=u.some(id=>Q[id]&&funQuestion(Q[id])),lastGeo=geo(Q[u[u.length-1]]),unitUsed=u.some(id=>mazzelUnit(Q[id]));if(pool.length>1&&remaining>0){const all=rankQuestions(pool,u);for(const strict of [true,false]){const ranked=all.filter(({q})=>{if(strict&&lastGeo&&geo(q))return false;const y=pool.filter(x=>val(q,x)===true),n=pool.filter(x=>val(q,x)===false),f=fun||funQuestion(q);return y.length+n.length===pool.length&&finishable(y,remaining-1,f,geo(q),strict,unitUsed||mazzelUnit(q))&&finishable(n,remaining-1,f,geo(q),strict,unitUsed||mazzelUnit(q))});if(ranked.length){const best=ranked[0].s;let opts=ranked.filter(x=>x.s>=best*.72);opts=opts.filter((x,i)=>i<8||unitSong(x.q));if(!u.length&&opts.some(x=>x.q.id!==lastOpening))opts=opts.filter(x=>x.q.id!==lastOpening);if(pool.every(z=>z.g==='MAZZEL')&&!fun&&ranked.some(x=>funQuestion(x.q)))opts=ranked.filter(x=>funQuestion(x.q));return opts.map(x=>({q:x.q,s:x.s/best-difficulty(x.q)+routeNoise(x.q.id,routeSeed)*.42-(previousRoute.includes(x.q.id)?.18:0)-(geo(x.q)&&u.some(id=>geo(Q[id]))?.25:0)})).sort((a,b)=>b.s-a.s)[0].q}}}return fallbackPick(pool,u)}

function bonusQuestion(){const name=p[0]?.n,list=bonusBank[name]||[];if(!list.length)return;const weighted=name==='KAIRYU'?list.flatMap((q,i)=>q[0]==='え、もしかして焼き鳥？'?[i,i]:[i]):list.map((q,i)=>i);const i=weighted[Math.floor(routeNoise(987,routeSeed)*weighted.length)];return {j:list[i][0],e:list[i][1],id:1000+i}}
function funQuestion(q){return q.scope==='MAZZEL'&&q.id>=41&&q.id!==47&&q.id!==48&&q.id!==49}

function start(){if(used.length){previousRoute=used.slice();lastOpening=used[0];try{localStorage.setItem('bmsg-bias-last-route',JSON.stringify(previousRoute))}catch(e){}}else{try{const saved=JSON.parse(localStorage.getItem('bmsg-bias-last-route')||'[]');if(Array.isArray(saved)){previousRoute=saved;lastOpening=saved[0]??-1}}catch(e){}}routeSeed=(Math.random()*4294967296)>>>0;p=people.slice();used=[];hist=[];count=skip=0;page='play';render()}
function ans(v){hist.push({p:p.slice(),used:used.slice(),count,skip});used.push(cur.id);try{localStorage.setItem('bmsg-bias-last-route',JSON.stringify(used))}catch(e){}if(v===null)skip++;else{count++;p=p.filter(z=>val(cur,z)===null||val(cur,z)===v)}if(p.length===1)page=p[0].g==='MAZZEL'&&count<5&&bonusQuestion()?'bonus':'result';render()}function back(){if(!hist.length)return;({p,used,count,skip}=hist.pop());page='play';render()}function btn(label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;root.append(b)}function html(s){root.insertAdjacentHTML('beforeend',s)}async function exportResult(z,n,english){
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');

 try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))])}catch(e){}
 rect(0,0,1080,1350,paper);rect(69,72,960,1220,ink);rect(55,55,960,1220,'white');x.strokeStyle=ink;x.lineWidth=4;x.strokeRect(55,55,960,1220);
 text('PLAY ROOM  /  GUESS YOUR BIAS',114,28,900);text("WHO'S YOUR",192,68,900);rect(267,251,546,23,pink);text('BIAS IN BMSG?',263,68,900);
 rect(273,321,550,690,ink);rect(260,307,550,690,'white');x.strokeRect(260,307,550,690);rect(278,325,514,654,violet);
 let photo=false;
 for(const src of [portraits[z.n],({"KAIRYU":"../img/mazzel-gacha/photos/kairyu/01.f.webp","NAOYA":"../img/mazzel-gacha/photos/naoya/01.f.webp","RAN":"../img/mazzel-gacha/photos/ran/01.f.webp","SEITO":"../img/mazzel-gacha/photos/seito/01.f.webp","RYUKI":"../img/mazzel-gacha/photos/ryuki/01.f.webp","TAKUTO":"../img/mazzel-gacha/photos/takuto/01.f.webp","HAYATO":"../img/mazzel-gacha/photos/hayato/01.f.webp","EIKI":"../img/mazzel-gacha/photos/eiki/01.f.webp"})[z.n]].filter(Boolean)){try{const im=await new Promise((resolve,reject)=>{const i=new Image();const timer=setTimeout(()=>reject(Error('timeout')),7000);i.crossOrigin='anonymous';i.onload=()=>{clearTimeout(timer);resolve(i)};i.onerror=()=>{clearTimeout(timer);reject(Error('image'))};i.src=portraitSrc(src)});const scale=Math.max(514/im.naturalWidth,654/im.naturalHeight);x.save();x.beginPath();x.rect(278,325,514,654);x.clip();x.drawImage(im,278+(514-im.naturalWidth*scale)/2,325+(654-im.naturalHeight*scale)*.25,im.naturalWidth*scale,im.naturalHeight*scale);x.restore();photo=true;break}catch(e){}}
 if(!photo){rect(200,290,680,730,'white');rect(145,395,790,470,violet);text('YOUR BIAS IS...',490,34,900);text(z.n,665,100,900,ink,740);text(z.g,745,35,700)}
 if(photo){text(z.n,1080,84,900);text(z.g,1131,32,700);}text(english?'Guessed in '+n+' answers!':n+'問で当てられました！',1190,42,900);text('PLAY ROOM  /  UNOFFICIAL FAN GAME',1240,24,700);

function addSave(z,n){

 const share=document.createElement('button'),save=document.createElement('button'),status=document.createElement('p'),preview=document.createElement('img');

 const show=()=>{preview.src=url;preview.hidden=false};

 const ready=async()=>{share.disabled=save.disabled=true;status.textContent=english?'Preparing image…':'画像を準備中…';try{await prepare();status.textContent=''}catch(e){status.textContent=english?'Image preparation failed. Tap to retry.':'画像を準備できませんでした。もう一度お試しください。'}finally{share.disabled=save.disabled=false}};

 ready();
}

z.n+'</div><small>'+z.g+'</small><p>'+count+t('問で予想しました！',' answers to guess!')+'</p>');addSave(z,count);btn(t('違うよ・回答を戻す','Incorrect · Go back'),back);btn(t('もう一度遊ぶ','Play again'),start,'start');return}html('<h2>'+t('もう少しヒントが必要みたい…','I need more clues…')+'</h2><p>'+p.map(z=>z.n).join(' / ')+'</p>');if(hist.length)btn(t('回答を戻す','Go back'),back);btn(t('もう一度遊ぶ','Play again'),start,'start')}document.querySelector('#lang').onclick=()=>{lang=lang==='ja'?'en':'ja';render()};render();
