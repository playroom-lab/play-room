ink of your bias.')+'</h2><p>'+t('5問以内に当てられるかな？','Can I guess in five questions?')+'</p><small>'+people.length+' ARTISTS / '+Q.length+' QUESTIONS · BETA</small>');btn('START GAME',start,'start');html('<details><summary>'+t('対象アーティスト','Artist lineup')+'</summary>'+people.map(z=>z.n).join(' · ')+'</details>');return}if(page==='play'){cur=pick(p,used);if(!cur){page=p.length===1?'result':'miss';return render()}html('<small>QUESTION '+(count+1)+'</small><div class="meter">'+Array.from({length:5},(_,i)=>'<i class="'+(i<count?'on':'')+'"></i>').join('')+'</div><h2>'+t(cur.j,cur.e)+'</h2>');btn(t('はい','Yes'),()=>ans(true),'yes');btn(t('いいえ','No'),()=>ans(false),'no');btn(t('わからない','Not sure'),()=>ans(null),'skip');html('<small>'+t('有効回答','Answers')+' '+count+' · '+t('スキップ','Skipped')+' '+skip+'</small>');if(hist.length)btn(t('ひとつ戻る','Go back'),back);return}if(page==='result'){const z=p[0];html('<span class="tag">YOUR BIAS IS...</span><p class="hand">'+t('あなたの推しは…','Your bias is...')+'</p>');if(portraits[z.n]){let im=document.createElement('img');im.className='portrait';im.alt=z.n;im.src=portraits[z.n];im.referrerPolicy='no-referrer';im.onerror=()=>{let d=document.createElement('div');d.className='photoFallback';d.textContent=z.n;im.replaceWith(d)};root.append(im)}else{html('<div class="photoFallback">'+z.n.slice(0,1)+'</div>')}html('<div class="name">'+z.n+'</div><small>'+z.g+'</small><p>'+count+t('問で予想しました！',' answers to guess!')+'</p>');btn(t('正解！ Xでシェア','Correct! Share on X'),()=>{const msg=t('私の推しは'+z.n+'！ '+count+'問で当てられました！','My bias is '+z.n+'! Guessed in '+count+' answers!')+'\n#BMSG推し当てゲーム';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent('https://playroom-lab.github.io/play-room/bmsg-bias/'),'_blank','noopener')},'yes');btn(t('違うよ・回答を戻す','Incorrect · Go back'),back);btn(t('もう一度遊ぶ','Play again'),start,'start');return}html('<h2>'+t('もう少しヒントが必要みたい…','I need more clues…')+'</h2><p>'+p.map(z=>z.n).join(' / ')+'</p>
