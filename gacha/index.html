<body>
<div class="wrap">
  <header class="room-nav">
    <a href="../">PLAY ROOM</a>
    <span class="old-version">推しガチャ開封所</span>
  </header>
  <section class="room-hero">
    <div><p class="room-label">01 / OPEN &amp; COLLECT</p>
    <h1>推し<span>ガチャ</span>開封所</h1>
    <p class="sub">銀袋を開けて、推しを自引き。<br>ひとりでも、お友達とでも。</p></div>
    <span class="hero-photo" aria-hidden="true"><img src="../img/mazzel-gacha/photos/group/01.t.webp" alt="" width="160" height="130"><span>自引きしたい！</span></span>
  </section>


  <div class="banner" id="banner" hidden></div>
  <div class="roombar" id="roombar" hidden></div>
  <div class="players" id="players"></div>
  <section class="stage" id="stage" aria-live="polite"><p class="empty">読み込み中…</p></section>

  <section class="panel guide" id="guide" hidden aria-labelledby="guide-h">
    <h2 id="guide-h">遊び方</h2>
    <ol class="steps">
      <li><b>遊び方を選ぶ</b><span>ひとりでも、お友達とでも。</span></li>
      <li><b>推しを選ぶ</b><span>推しのカードが出たら「自引き」！</span></li>
      <li><b>銀袋を切って開ける</b><span>切り取り線を指でなぞって開封。写真を集めてコンプリートをめざそう。</span></li>
    </ol>
  </section>


  <div class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" aria-selected="true" data-tab="rank">みんなの結果</button>
    <button role="tab" aria-selected="false" data-tab="coll">コレクション</button>
    <button role="tab" aria-selected="false" data-tab="set">設定</button>
  </div>
  <section class="panel" id="panel" hidden></section>
  <footer class="credit">MAZZEL・BMSG公式とは関係のない非公式ファンメイドツールです。<br><span>PLAY ROOM</span></footer>
</div>
