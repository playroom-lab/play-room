    <div class="plist" id="plist" hidden=""></div>
    <div class="route"><div class="track" id="track"><span class="fill" id="rFill"></span><span class="node" style="left:0%"><span>会場</span></span><span class="node" style="left:25%"><span>駅</span></span><span class="node" style="left:55%"><span>電車</span></span><span class="node" style="left:85%"><span>最寄り</span></span><span class="node last" style="left:100%"><span>家</span></span><span class="walker wait" id="rMe" style="left:0%"></span></div></div>

  </div>

<script>
/* ライブ帰りシミュレーター はるや版 */
(function(){
const {ACT}=ChatSim;
const A=ChatSim.api;
const H=m=>21*60+m;           // 21:mm
const START=H(34);
const O=x=>({x,oshi:1});       // 推しの話（読むと眠くなる）
const at=(S)=>S.arrive;        // 最寄り着
const home=S=>S.arrive+9;      // 家に着く
const prep=S=>(S.karaage?1:0)+(S.shelf?1:0)+(S.bath?1:0);
const left=S=>Math.max(0,home(S)-S.t);

const AQ=(t,fx,r,ex)=>Object.assign({t,fx,r:r||[]},ex||{});
const AS=(st,fx,r)=>({stamp:st,fx,r:r||[]});
const TRAIN=[ // 電車で語らせて（2分ごとに1かたまり。かたまりごとの相槌つき）
  {l:[O("まずね"),O("オープニングで{name}がいちばん最初に出てきたの")],c:[
    AQ("最初から！？",{sleep:2,mood:2},["そう！心の準備できてなかった"]),
    AQ("うんうん",{sleep:1,mood:1},[],{aiz:1}),
    AS(["🎆","どーん"],{mood:1},["それそれ"])]},
  {l:[O("で、2曲目の前に{name}が"),O("ちょっと笑ったの"),O("あれ絶対なんか思い出し笑い")],c:[
    AQ("何を思い出したんだろうね",{sleep:2,mood:3},["気になって次の曲入ってこなかった"]),
    AQ("思い出し笑いかわいいね",{sleep:2,mood:2},["かわいいの"]),
    AQ("気のせいじゃない？",{mood:-4},["見たもん"])]},
  {l:[O("あとダンス"),O("前より腕の角度が変わってて"),O("ほんとに細かいんだけど")],c:[
    AQ("よく気づくね",{sleep:2,mood:3},["見ちゃうの"]),
    AQ("へえ〜",{sleep:1,mood:1},[],{aiz:1}),
    AQ("（既読だけつけておく）",{mood:-5},[],{silent:1})]},
  {l:[O("{name}のソロのところ"),O("声がちょっと震えてて"),O("泣くかと思った")],c:[
    AQ("それは泣く",{sleep:2,mood:3},["でしょ！？"]),
    AQ("泣かなかったの？",{sleep:2,mood:2},["…ちょっと泣いた"]),
    AS(["🥲","うるっ"],{mood:1},["わかってくれる"])]},
  {l:[O("MCで{name}が"),O("最近ハマってるパンの話してた"),O("たぶん駅前のあの店")],c:[
    AQ("今度そのパン屋行こうよ",{sleep:1,mood:5},["行く！！","聖地巡礼"]),
    AQ("パン好きなんだ",{sleep:1,mood:1},[],{aiz:1}),
    AQ("俺もパン好きだけど",{mood:-1},["知ってる笑"],{jealous:1})]},
  {l:[O("あとね"),O("最後のあいさつ"),O("「また会おうね」って3回言ってた")],c:[
    AQ("3回も？",{sleep:2,mood:2},["3回！"]),
    AQ("また会えるといいね",{sleep:1,mood:4},["うん…絶対会う"]),
    AQ("なるほど",{sleep:1,mood:0},[],{aiz:1})]},
  {l:[O("3回目はちょっと噛んでた"),O("それもよかった")],c:[
    AQ("噛んだのもよかったんだ笑",{sleep:1,mood:3},["そこがいいの"]),
    AQ("うんうん",{sleep:1,mood:1},[],{aiz:1}),
    AS(["😂","わら"],{mood:1},["笑うとこじゃない笑"])]},
  {l:[O("衣装も2着目がほんとによくて"),O("ジャケットの裏地が"),O("ちらっと赤いの")],c:[
    AQ("裏地まで見てるの？",{sleep:2,mood:2},["見えるの、動くと"]),
    AQ("写真ある？",{sleep:1,mood:3},["撮影禁止だよ","目に焼きつけた"]),
    AQ("へえ〜",{sleep:1,mood:0},[],{aiz:1})]},
  {l:[O("{name}がこっち側の花道来たとき"),O("時が止まった")],c:[
    AQ("近かった？",{sleep:2,mood:3},["近かった…","まだ手が震えてる"]),
    AQ("止まってよかったね",{sleep:1,mood:2},["よかった"]),
    AS(["⏸","とまった"],{mood:2},["それ笑"])]},
  {l:[O("…ってことがあったの"),"ごめん長くなった"],c:null}
];


const SCN={
  id:"lk-haruya",title:"ライブ帰りシミュレーター はるや版",start:START,speed:6000,
  fine:"フィクションです。登場する人物・会場・団体はすべて架空です。",
  clearNote:"おかえり。次は、ちがう夜で。",
  infoThread:"info",
  links:[["本編（ライブ帰り）","../"],["すずさん版","../suzu/"]],
  threads:{
    akari:{name:"あかり",short:"あかり",col:"#ff8fab",ini:"あ"},
    yuma:{name:"ゆうま",short:"ゆうま",col:"#7fb2ff",ini:"ゆ"},
    info:{name:"お知らせ",col:"#6b6680",ini:"!",static:1},
    mom:{name:"母",short:"母",col:"#e7b25e",ini:"母"},
    yui:{name:"ゆい（あかりの友だち）",short:"ゆい",col:"#e98aae",ini:"ゆ"},
    sota:{name:"コウタ",short:"弟",col:"#5fbfa0",ini:"コ"},
    work:{name:"会社の同期",col:"#9ac26b",ini:"同",n:5,group:1,static:1,last:"明日の資料、朝イチでよろしく〜",lastT:H(2),msgs:[{k:"them",who:"たかの",x:"明日の資料、朝イチでよろしく〜",t:H(2)}]}
  },
  order:["akari","yui","sota","yuma","mom","info","work"],
  diffs:{
    normal:{name:"通常",desc:"眠気25からスタート。推しの話を読んでも、少しだけ眠くなりにくい",stats:{sleep:25}},
    hard:{name:"ムズい",desc:"残業帰りでくたくた。眠気35からスタート。推しの話でぐんぐん眠くなる",stats:{sleep:35},scene:["ムズい","残業帰り","ネクタイをゆるめた瞬間、ソファが呼んでいる。","眠気35からスタート"]}
  },
  stats:[
    {key:"sleep",label:"眠気",init:35,max:100,color:v=>v>=75?"#ff6b6b":v>=55?"#ffb84d":"var(--violet)",warn:v=>v>=85?" 限界":v>=70?" やばい":""},
    {key:"mood",label:"あかりの機嫌",init:60,max:100,color:v=>v<30?"#ff6b6b":v<50?"#ffb84d":"var(--pink)",warn:v=>v<25?" つめたい":v>=80?" ごきげん":""}
  ],
  init(S){
    S.arrive=24*60+3;S.delay=Math.random()<.5?8:0;S.cardAns=A.pick(["左","まんなか","右"]);
    S.coffee=0;S.wash=0;S.karaage=0;S.bread=0;S.shelf=0;S.bath=0;S.bathFirst=0;S.lying=0;S.game=0;S.stretchT=0;
    S.karaReq=0;S.shelfReq=0;S.breadReq=0;S.wakeReq=0;S.wakeAsked=0;S.woke=0;S.early=0;S.akSlept=0;S.pick=0;S.talk=-1;S.talkN=TRAIN.length;S.aiz=0;S.silent=0;
    S.m.oshi=0;S.m.yawn=0;S.out=0;S.jealous=0;S.car=1;S.yuiHelp=0;
  },
  ticket(S){
    if(S.pick) return {small:"あかりと",big:"駅で合流",sub:"あと"+Math.max(0,S.pickAt-S.t)+"分"};
    if(S.t<23*60+12) return {small:"あかりの終電",big:"23:12",sub:"まだ会場の近く"};
    return {small:"おかえりまで",big:"あと"+left(S)+"分",sub:A.fmt(home(S))+"ごろ帰宅",cls:left(S)<=15?"hot":""};
  },
  route:{
    nodes:[[0,"会場"],[25,"駅"],[55,"電車"],[85,"最寄り"],[100,"家"]],
    pct(S){const t=S.t;
      if(t<H(41)) return 0;
      if(t<H(100)) return (t-H(41))/(H(100)-H(41))*25;
      if(t<23*60+12) return 25;
      if(S.akSlept&&t>=at(S)) return 92;
      if(t<at(S)) return 55+(t-(23*60+12))/(at(S)-(23*60+12))*30;
      if(S.pick) return 85;
      return Math.min(100,85+(t-at(S))/9*15);
    },
    wait(S){const t=S.t;return t<H(41)||(t>=H(100)&&t<23*60+12)||(S.delay&&S.delayOn&&t<at(S))}
  },
  minute(S,api,n){
    if(S.wakeAsked&&!S.woke&&!S.akSlept&&S.t>=at(S)) S.akSlept=1;
    const every=S.lying?1:S.t>=23*60?3:4;
    if(n%every===0) api.change("sleep",1);
    if(S.lying&&n%3===0&&!S.m.lyNote){S.m.lyNote=1;api.scene("ソファ","気持ちよすぎる","クッションが体の形に沈んでいく。","ちょっとだけ、ちょっとだけ…")}
    const T=S.th.akari;
    if(api.openQ("akari")&&S.t-T.pendT>=5&&(S.t-T.pendT)%2===1) api.change("mood",-1);
    const la=(S.lastAns&&S.lastAns.akari)||START;
    if(S.t-la>=10&&n%4===0&&!S.akSlept) api.change("mood",-1);
    if(n%7===0&&!S.akSlept) api.change("mood",-1);
    if(S.delayMsg&&!T.busy&&!api.openQ("akari")&&!T.asking){S.delayMsg=0;api.them("akari",["ちょっと待って","電車止まった…","8分遅れるって","{home}くらいになるかも"]);return}
    if(S.talk>=0&&S.talk<S.talkN&&n%2===0&&!T.busy&&!api.openQ("akari")&&!T.asking){
      const chunk=TRAIN[S.talk];S.talk++;
      const last=S.talk>=S.talkN||!chunk.c;
      if(last) api.them("akari",TRAIN[TRAIN.length-1].l);
      else api.ask("akari",chunk.l,chunk.c.map(c=>Object.assign({},c,{on:(S)=>{if(c.aiz)S.aiz++;if(c.silent)S.silent++;if(c.jealous)S.jealous++}})));
      if(last) S.talk=99;
    }
    if(S.pick&&!S.akSlept&&S.t>=S.pickAt) finish(S,api,"pickup");
    if(!S.pick&&!S.akSlept&&S.t>=home(S)) finish(S,api,"home");
  },
  onStat(S,api,k){
    if(k==="sleep"&&S.sleep>=100) api.end("sofa");
    if(k==="sleep"&&S.sleep>=85&&!S.m.warn85){S.m.warn85=1;api.scene("眠気","まぶたが重い","スマホの文字がにじんで見える。","やばい、なにか動かないと")}
  },
  onRead(S,api,th,msgs){
    if(th!=="akari") return;
    let n=0;for(const m of msgs) if(m.oshi) n++;
    if(!n) return;
    S.m.oshi+=n;S.zz=(S.zz||0)+n*(S.diff==="hard"?1.8:1.4);const z=Math.floor(S.zz);S.zz-=z;api.change("sleep",z);
  },
  chase:{akari:{ms:26000,max:3,lines:["ねえ","既読ついてるよ？","…寝てないよね？"],on:(S,api)=>api.change("mood",-3)}},
  alerts(S){
    const a=[];
    if(S.sleep>=75) a.push({lv:3,x:"眠気が限界に近い（100で寝落ち）"});
    else if(S.sleep>=55) a.push({lv:2,x:"だんだん眠くなってきた"});
    if(S.lying) a.push({lv:2,x:"ソファで横になっている"});
    if(S.mood<30) a.push({lv:3,x:"あかりの機嫌がかなり悪い",th:"akari"});
    else if(S.mood<45) a.push({lv:2,x:"あかりの機嫌がちょっと悪い",th:"akari"});
    if(S.wakeAsked&&!S.woke&&!S.akSlept&&S.t>=at(S)-10&&S.t<at(S)) a.push({lv:3,x:"いまコールして起こす時間！"});
    if(S.karaReq&&!S.karaage&&left(S)<=40) a.push({lv:2,x:"からあげ棒、まだ買ってない"});
    if(S.shelfReq&&!S.shelf&&left(S)<=30) a.push({lv:1,x:"棚がまだ段ボールのまま"});
    return a;
  },
  stage(S){
    const acts=[];
    let text=S.lying?"ソファで横になっている…":"家のリビングにいる";
    if(S.t>=23*60+12&&!S.pick) text+="・あかりの帰宅 "+A.fmt(home(S))+"ごろ";
    if(S.lying) acts.push({label:"起き上がる",pulse:1,on:()=>{S.lying=0;A.change("sleep",-2);A.hud()}});
    else acts.push({label:"やること",on:()=>doMenu(S)});
    if(S.wakeAsked&&!S.woke&&S.t<at(S)) acts.push({label:"あかりにコール",sub:S.t<at(S)-10,pulse:S.t>=at(S)-10,on:()=>wakeCall(S)});
    if(!S.pick&&!S.akSlept&&S.t>=at(S)-10&&S.t<at(S)+3) acts.push({label:"駅まで迎えに行く",sub:1,on:()=>A.confirmBox("駅まで迎えに行く？","歩いて8分。最寄り駅の改札で待つ。","行く","やめる",()=>{S.pick=1;S.pickAt=Math.max(S.t+8,at(S));S.lying=0;A.change("sleep",-6);A.scene("外へ","夜風がつめたい","サンダルをつっかけて駅へ向かう。","眠気が少し飛んだ");A.me("akari",{x:"駅まで迎えに行くね"});later(()=>A.them("akari",["え！！","うれしい","待ってる"]),1500);A.hud()})});
    return {text,ready:S.t>=at(S)-10&&!S.pick,acts};
  },
  where(S){return {sofa:"リビングのソファ",terminal:"終点の駅前",pickup:"最寄り駅の改札"}[S.endKind]||"家の玄関"},
  endOrder:["best","home","pickup","bet","cold","sofa","terminal"],
  endings:{
    best:{name:"最高のおかえり",clear:1,text:"玄関を開けたあかりが固まる。机にからあげ棒、棚にはグッズの場所、お風呂も沸いてる。「え、なにこれ」って言いながら、もう泣き笑いだった。{name}の話は、明日の朝ごはんのときにもう一回ちゃんと聞く。"},
    home:{name:"おかえりが言えた",clear:1,text:"ちゃんと起きて「おかえり」が言えた。あかりは靴も脱がずに{name}の話の続きを始める。眠いけど、うれしそうだからまあいいか。"},
    pickup:{name:"駅まで迎えに",clear:1,text:"改札から出てきたあかりが、こっちを見つけて小走りになる。紙袋ふたつ、片方持つ。帰り道はずっと{name}の話。夜の道がいつもより短かった。"},
    bet:{name:"1000円の勝ち",clear:1,text:"「おかえり」のあと、コウタに証拠の写真を送る。『まじか』『兄ちゃん本気出しすぎ』。明日の朝ごはんは、1000円の話と{name}の話の続き。"},
    cold:{name:"冷たいおかえり",text:"起きてはいた。でも「…ただいま」の声が低い。返事がそっけなかったこと、たぶん全部覚えてる。今夜の{name}の話は、もう聞かせてもらえない。"},
    sofa:{name:"ソファで寝落ち",black:1,text:"気づいたら朝だった。体には毛布。テーブルにはあかりのメモ「おかえりって言ってほしかったな」。その横に、{name}のトレカが1枚置いてあった。{betline}"},
    terminal:{name:"終点までお迎え",text:"「…終点」のメッセージで飛び起きた。{carline}帰りの車内で、あかりは{name}の話をもう一周した。帰りついたのは2時すぎ。"}
  },
  result(S,kind){
    const awake=kind!=="sofa";
    return {
      ticket:kind==="sofa"?["眠気","100"]:["機嫌",String(S.mood)],
      checks:[["起きて待てた",awake],["機嫌よし",S.mood>=70],["準備3つ",prep(S)===3]],
      big:{n:prep(S),of:3,label:"おかえりの準備（からあげ棒・棚・お風呂）",short:"おかえりの準備"},
      stats:[["眠気",String(S.sleep)],["機嫌",String(S.mood)],["推しの話",S.m.oshi+"件"],["コーヒー",S.coffee+"杯"]],
      kv:[["読んだ推しの話",S.m.oshi+"件"],["あかりへの返信",(S.m.by.akari||0)+"回"],["コーヒー",S.coffee+"杯"],["からあげ棒",S.karaage?(S.bread?"買った（メロンパンも）":"買った"):"買ってない"],["棚",S.shelf?"組み立てた":"段ボールのまま"],["お風呂",S.bath?(S.bathFirst?"沸かして先に入った":"沸かした"):"沸かしてない"],["起こすコール",S.woke?"かけた":S.wakeAsked?"かけられなかった":"—"],["電車の遅れ",S.delay?S.delay+"分":"なし"]]
    };
  },
  titles:[
    {id:"noSleep",name:"推しの話で寝ない男",hint:"推しの話をたくさん読んで、最高のおかえり",ok:(S,k)=>k==="best"&&S.m.oshi>=28},
    {id:"ideal",name:"理想の彼氏",hint:"準備を全部そろえて、ごきげんで迎える",ok:(S,k)=>k==="best"},
    {id:"betlose",name:"1000円の負け",hint:"弟の賭けに乗って寝落ち",ok:(S,k)=>S.bet&&k==="sofa"},
    {id:"blanket",name:"毛布をかけられた男",hint:"ゴール目前で力つきる",ok:(S,k)=>k==="sofa"&&S.t>=at(S)-15},
    {id:"sofa",name:"寝落ち彼氏",hint:"ソファには勝てない",ok:(S,k)=>k==="sofa"},

function finish(S,api,kind){
  if(S.reunion) return;S.reunion=1;
  const say=[],hand=[];
  if(kind==="pickup"){api.change("mood",8);say.push("え、ほんとに来てくれた…！","袋ひとつ持って笑")}
  else say.push("ただいま〜！！","起きてた！えらい");
  if(S.karaReq){if(S.karaage){say.push(S.bread?"からあげ棒とメロンパン…！最高":"からあげ棒ある！！");api.change("mood",4)}else{say.push("…からあげ棒は？");hand.push("頼まれていたのに、買っていない");api.change("mood",-10)}}
  if(S.shelfReq){if(S.shelf){say.push("棚できてる…グッズの場所！");api.change("mood",3)}else{say.push("棚、まだ段ボールだね…");api.change("mood",-4)}}
  if(S.bath) say.push("お風呂わいてる…神");else if(kind!=="pickup") say.push("お風呂入りたい〜");
  if(S.listenLater) say.push("で、MCの話の続きなんだけど");
  const title=say.shift();
  api.scene(kind==="pickup"?"合流":"ただいま","「"+title+"」",say.map(x=>"「"+x+"」").join(" "),hand.join("・")||(kind==="pickup"?"紙袋をひとつ受け取る":"玄関で、あかりが笑っている"),"",{wait:true,onClose:()=>{
    if(S.mood<25) return api.end("cold");
    if(S.bet) return api.end("bet");
    if(kind==="pickup") return api.end("pickup");
    if(prep(S)===3&&S.mood>=70) return api.end("best");
    api.end("home");
  }});

}
function act(S,min,sleep,title,body,hand){
  S.lying=0;A.scene(min+"分",title,body,hand);A.addTime(min);A.change("sleep",sleep);A.hud();
}

    {label:"コーヒーを淹れる",sub:S.coffee>=2?"もう飲めない":"眠気−15・3分（あと"+(2-S.coffee)+"杯）",disabled:S.coffee>=2,on:()=>{S.coffee++;act(S,3,-15,"コーヒー","ドリップの音で少し目が覚める。",S.coffee===2?"これ以上は寝られなくなる":"にがい")}},
    {label:"顔を洗う",short:"顔洗い（2回）",done:S.wash>=2,sub:"眠気"+[-8,-5][Math.min(S.wash,1)]+"・2分（あと"+(2-S.wash)+"回）",on:()=>{const d=[-8,-5][Math.min(S.wash,1)];S.wash++;act(S,2,d,"洗面所","冷たい水。",S.wash>2?"だんだん慣れてきた":"しゃっきり")}},
    {label:"ストレッチ",sub:S.t<S.stretchT?"さっきやった":"眠気−3・1分",disabled:S.t<S.stretchT,on:()=>{S.stretchT=S.t+20;act(S,1,-3,"ストレッチ","肩をまわす。ゴキッと鳴った。","")}},
    {label:"コンビニに行く",short:"コンビニ",done:S.karaage,sub:!S.karaReq?"いまは用事がない":L<16?"帰りに間に合わない":"眠気−12・12分・からあげ棒",disabled:!S.karaReq||L<16,on:()=>{S.karaage=1;if(S.breadReq) S.bread=1;act(S,12,-12,"コンビニ","夜風で目が覚める。からあげ棒、最後の1本。",S.breadReq?"メロンパンも買った":"ついでに自分のアイスも");A.me("akari",{photo:"karaage"});A.later(()=>A.them("akari",["！！！","最後の1本？","すき"]),1500);A.change("mood",5)}},
    {label:"棚を組み立てる",short:"棚",done:S.shelf,sub:L<18?"時間が足りない":"眠気−6・15分・その間は返信できない",disabled:L<18,on:()=>{S.shelf=1;act(S,15,-6,"組み立て","説明書どおりに、ネジ12本。",S.shelfReq?"あかりのグッズの場所ができた":"なんの棚かは知らない")}},
    {label:"お風呂を沸かす",short:"お風呂",done:!!S.bath,sub:"2分",on:()=>{S.bath=1;act(S,2,0,"お風呂","スイッチを押した。","「お風呂が沸きました」まで20分")}},
    {label:"先にお風呂に入る",sub:!S.bath?"まだ沸いてない":S.bathFirst?"もう入った":"15分・あったまる",disabled:!S.bath||S.bathFirst,on:()=>{S.bathFirst=1;act(S,15,18,"お風呂","お湯につかると、体の芯から力が抜けていく。","…まずい、ねむい")}},
    {label:"ソファで横になる",sub:"ちょっとだけ",disabled:S.lying,on:()=>{S.lying=1;A.change("sleep",8);A.scene("ソファ","ちょっとだけ","目を閉じるだけ。寝ない。","")}}
  ];
  A.menu("やること","時間がたつ間も、あかりからの連絡は届く。",items);
}
function wakeCall(S){
  const w=at(S);
  if(S.t<w-10){S.early++;A.ring("akari",()=>{A.change("mood",-1);A.later(()=>A.them("akari",["まだ早いよ笑","起きてるから大丈夫","{wake}ごろでお願い"]),1200)});return}
  A.ring("akari",()=>{S.woke=1;A.change("mood",6);A.change("sleep",-4);A.hud();A.later(()=>A.them("akari",["……","はっ","起きた！！","コールありがと、あぶなかった"]),1500)});
}
window.HARUYA=SCN;
})();
ChatSim.start(window.HARUYA);
</script>
