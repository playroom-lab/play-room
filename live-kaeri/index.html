<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ライブ帰りシミュレーター｜PLAY ROOM</title>
  <meta name="description" content="規制退場から終電まで。手渡しのトレカ交換を済ませて、電池を残したまま終電に乗れるか。チャットで遊ぶライブ帰りシミュレーター。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f5ed">
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-width column. A paper "game band" on top (stats, pinch, route, the one action), below it a chat app. Paper/ink/pastel follows the play room site. Single fixed look by design. */
:root{
  --paper:#f7f5ed; --ink:#282536; --pmuted:#625f6d; --pline:#d5d1d9;
  --pink:#ffd5df; --lime:#dcefa5; --violet:#ded7ff; --sky:#cfe3ff;
  --hot:#e5486a;
  --app:#ffffff; --wall:#8fabd3; --sub:#8b8f99; --rule:#e6e7eb;
  --mine:#8de055; --them:#ffffff; --brand:#06c755; --bad:#ff5f5f;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-hand:"Klee One","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #8051bd;outline-offset:2px}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--app);overflow:hidden;border-inline:1px solid var(--pline)}

/* ---- game band (paper) ---- */
.band{background:var(--paper);color:var(--ink);padding:9px 12px 10px;display:flex;flex-direction:column;gap:7px;font-family:var(--f-head);border-bottom:1.5px solid var(--ink)}
.srow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.stat{min-width:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.06em}
.lab b{font-size:13px;font-variant-numeric:tabular-nums;transition:color .3s}
.lab b.flash{color:var(--hot)}
.lab em{font-style:normal;color:var(--hot);margin-left:4px}
.bar{height:8px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;margin-top:3px;overflow:hidden}
.bar span{display:block;height:100%;transition:width .5s,background .5s;border-right:1.5px solid var(--ink)}
.train{border:1.5px solid var(--ink);background:#fff;padding:2px 8px;text-align:center;transform:rotate(3deg);line-height:1.25;min-width:84px}
.train small{display:block;font-size:9px;letter-spacing:.12em;color:var(--pmuted)}
.train b{display:block;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.train i{display:block;font-style:normal;font-size:10px;font-weight:700}
.train i.warn{color:#b07a00} .train i.crit{color:var(--hot)}
.pinch{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--ink);background:#fff;border-radius:5px;box-shadow:2px 3px 0 var(--ink);padding:5px 9px;font-size:12px;font-weight:700;text-align:left;cursor:pointer;min-height:32px;font-family:var(--f-head)}
.pinch i{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1.5px solid var(--ink);background:var(--lime)}
.pinch span{flex:1;min-width:0;line-height:1.35}
.pinch small{flex:none;color:var(--pmuted);font-size:11px;font-weight:500}
.pinch.warn{background:#fff8e0} .pinch.warn i{background:#ffe08a}
.pinch.crit{background:var(--pink)} .pinch.crit i{background:var(--hot);color:#fff;animation:blink .9s infinite}
@keyframes blink{50%{opacity:.35}}
.plist{border:1.5px solid var(--ink);background:#fff;border-radius:5px;box-shadow:2px 3px 0 var(--ink);padding:4px;display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto;margin-top:-2px}
.plist button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-radius:4px;font-size:12px;font-weight:700;font-family:var(--f-head);cursor:pointer}
.plist button:hover{background:var(--paper)}
.plist button i{font-style:normal;flex:none;width:8px;height:8px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink)}
.plist button.l2 i{background:#ffe08a} .plist button.l3 i{background:var(--hot)}
.plist button span{flex:1;min-width:0}
.plist button small{flex:none;color:var(--pmuted);font-weight:500}
.plist p{margin:0;padding:6px;font-size:12px;color:var(--pmuted)}
.route{padding:0 8px}
.track{position:relative;height:3px;background:var(--ink);margin:9px 0 17px;opacity:.9}
.track .fill{position:absolute;left:0;top:-2px;height:7px;background:var(--pink);border:1.5px solid var(--ink);border-radius:4px;transition:width .6s;box-sizing:border-box}
.node{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);transform:translate(-50%,-50%);box-sizing:border-box}
.node.on{background:var(--ink)}
.node span{position:absolute;top:11px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--pmuted);font-weight:700}
.node.on span{color:var(--ink)}
.node:nth-of-type(2) span{left:0;transform:none}
.node.last span{left:auto;right:0;transform:none}
.walker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);transform:translate(-50%,-50%);transition:left .6s;box-sizing:border-box;z-index:2}
.walker.wait{animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translate(-50%,-80%)}}
.arow{display:flex;gap:8px;align-items:center}
.stage{flex:1;min-width:0;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.stage b{display:inline-block;padding:1px 8px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.08em;transform:rotate(-2deg);flex:none}
.stage span{min-width:0;line-height:1.35}
.stage.ready b{background:var(--hot)}
.act{flex:none;border:1.5px solid var(--ink);border-radius:30px;padding:6px 14px;font-size:13px;font-weight:900;cursor:pointer;background:var(--pink);box-shadow:2px 3px 0 var(--ink);font-family:var(--f-head);transition:transform .12s,box-shadow .12s}
.act:active{transform:translate(2px,2px);box-shadow:0 1px 0 var(--ink)}
.act.sub{background:#fff;font-weight:700;font-size:12px}
.act.pulse{animation:nudge 1.1s infinite}
@keyframes nudge{50%{transform:translateY(-2px);box-shadow:2px 5px 0 var(--ink)}}

/* ---- phone status bar ---- */
.sbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 4px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--app)}
.sbar .r{display:flex;gap:7px;align-items:center}
.bat{display:inline-flex;align-items:center;gap:4px}
.bat i{position:relative;width:23px;height:11px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block;opacity:.85}
.bat i::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
.bat b{position:absolute;left:1px;top:1px;bottom:1px;background:var(--ink);border-radius:1px}
.bat.low b{background:var(--bad)} .bat.low #batp{color:var(--bad)} .bat.lp b{background:#f5c400}

/* ---- talk list ---- */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.list{flex:1;overflow-y:auto;background:var(--app)}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px}
.lhead h2{font-size:21px;margin:0}
.lhead .ic{display:flex;gap:16px;font-size:18px}
.search{margin:6px 16px 8px;background:#f1f2f4;border-radius:10px;padding:8px 12px;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}
.tabs span{flex:none;border-radius:999px;padding:4px 12px;font-size:12px;background:#f1f2f4;color:var(--sub)}
.tabs span.on{background:#16181d;color:#fff}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;width:100%;padding:9px 16px;background:none;border:0;text-align:left;cursor:pointer}
.row:hover{background:#f6f7f9}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none}
.row .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-weight:500;color:var(--sub);margin-left:4px;font-size:13px}
.row .pv{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;align-self:start;padding-top:4px}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--sub);text-align:center;background:var(--app)}
.nav span.on{color:#16181d;font-weight:700}
.nav i{display:block;font-style:normal;font-size:17px;line-height:1.3}

/* ---- talk room ---- */
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--wall)}
.chead{display:flex;align-items:center;gap:6px;padding:6px 10px 8px;background:var(--wall)}
.back{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px 4px 4px;display:flex;align-items:center;gap:4px}
.back .badge{font-size:11px;height:18px;min-width:18px}
.chead .t{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ic{display:flex;gap:14px;font-size:17px;padding-right:4px}
.pin{margin:0 10px 6px;padding:7px 12px;background:rgba(255,255,255,.88);border-radius:10px;font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
.pin b{color:#16181d}
.msgs{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:6px}
.day,.sys{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.2);padding:3px 12px;border-radius:999px;text-align:center;max-width:88%}
.day{margin:6px 0 4px} .sys{margin:4px 0}
.m{display:flex;gap:6px;align-items:flex-end;width:100%}
.m.them{justify-content:flex-start} .m.me{flex-direction:row-reverse}
.m .av{width:34px;height:34px;font-size:12px;align-self:flex-start}
.m .gap{width:34px;flex:none}
.col{display:flex;flex-direction:column;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.who{font-size:11px;color:#2b3a55;margin:0 0 3px 2px}
.bub{padding:8px 12px;border-radius:18px;line-height:1.5;word-break:break-word;font-size:15px;animation:pop .16s ease-out;color:#16181d}
.them .bub{background:var(--them)} .me .bub{background:var(--mine)}
.them.first .bub{border-top-left-radius:4px} .me.first .bub{border-top-right-radius:4px}
.tm{display:flex;flex-direction:column;font-size:10px;color:#3c4a63;line-height:1.3;flex:none;font-variant-numeric:tabular-nums}
.me .tm{align-items:flex-end}
.photo{width:180px;max-width:100%;aspect-ratio:4/3;border-radius:14px;position:relative;overflow:hidden;animation:pop .16s ease-out;background:
  radial-gradient(circle at 28% 40%,#ffd1e0 0 9%,transparent 10%),radial-gradient(circle at 46% 32%,#fff3c4 0 8%,transparent 9%),
  radial-gradient(circle at 62% 46%,#ffb3c9 0 10%,transparent 11%),radial-gradient(circle at 38% 58%,#e9d9ff 0 9%,transparent 10%),
  radial-gradient(circle at 70% 30%,#fffaf0 0 7%,transparent 8%),radial-gradient(circle at 54% 62%,#ffc9a8 0 8%,transparent 9%),
  linear-gradient(180deg,#e9eef5 0 62%,#c9d2de 62% 100%)}
.photo::after{content:"";position:absolute;left:38%;top:70%;width:24%;height:14%;background:#fff;border-radius:2px}
.photo.board{background:linear-gradient(90deg,transparent 30%,#9b7653 30% 33%,transparent 33% 67%,#9b7653 67% 70%,transparent 70%) bottom/100% 22% no-repeat,radial-gradient(circle at 50% 46%,#fff 0 36%,transparent 37%),linear-gradient(180deg,#efe4d2,#e3d3bb)}
.photo.board::before{content:"WELCOME";position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--f-hand);font-weight:600;font-size:15px;color:var(--hot);letter-spacing:.08em}
.photo.board::after{left:41%;top:43%;width:18%;height:22%;border-radius:50%;background:#ffe3c2;box-shadow:-30px 6px 0 -6px #ffd5df,30px 6px 0 -6px #ded7ff}
.photo.goods{background:linear-gradient(135deg,#f7e7d4,#f3f0ea)}
.photo.goods::after{left:14%;top:22%;width:20%;height:52%;border-radius:4px;background:#cfd8ea;box-shadow:42px 0 0 #f2c6d3,84px 0 0 #d8ead2,126px 0 0 #efe2b7}
.stamp{width:120px;height:110px;border-radius:20px;display:grid;place-items:center;text-align:center;font-size:12px;color:#33405a;background:rgba(255,255,255,.45);padding:8px;line-height:1.4;animation:pop .16s ease-out}
.stamp b{display:block;font-size:30px;line-height:1.1;margin-bottom:4px}
.post{width:220px;max-width:100%;background:#fff;border-radius:14px;overflow:hidden;animation:pop .16s ease-out}
.post .pimg{aspect-ratio:1;background:linear-gradient(135deg,#3a3550,#c88aa8 55%,#ffd9a8)}
.post .pbody{padding:8px 10px;font-size:12px;line-height:1.5}
.post .pbody b{display:block;font-size:12px}
.post button{width:100%;border:0;border-top:1px solid var(--rule);background:#fff;padding:9px;font-weight:700;color:#0a64e0;cursor:pointer}
.post button:disabled{color:var(--sub);cursor:default}
.typing{display:flex;gap:4px;background:var(--them);border-radius:18px;padding:11px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#a5abb6;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.reply{background:var(--app);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule)}
.reply .q{font-size:11px;color:var(--sub);text-align:center}
.choice{text-align:left;background:#f4f5f7;border:1px solid var(--rule);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14px;line-height:1.4;color:#16181d}
.choice:hover{border-color:var(--brand)}
.choice.actn{color:#0a8f43;border-style:dashed;background:#fff}
.choice small{display:block;color:var(--hot);font-size:11px;margin-top:2px}

/* ---- banner ---- */
.phone{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.pa{position:absolute;left:8px;right:8px;top:6px;z-index:31;background:rgba(40,37,54,.94);color:var(--paper);border-radius:10px;padding:5px 10px;display:flex;gap:8px;align-items:center;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(-160%);transition:transform .3s;font-family:var(--f-head);border:0;text-align:left;cursor:pointer;width:auto}
.pa.on{transform:none}
.pa i{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:#fff}
.pa b{flex:none;font-size:10px;letter-spacing:.08em;opacity:.8}
.pa span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{position:absolute;left:8px;right:8px;top:6px;z-index:30;background:rgba(245,246,248,.97);border:0;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:translateY(-160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer;text-align:left;color:#16181d}
.banner.on{transform:none}
.banner .av{width:36px;height:36px;font-size:13px}
.banner b{display:block;font-size:13px}
.banner span.x{display:block;font-size:13px;color:#4a4f5a;line-height:1.45}
.banner div{min-width:0;flex:1}
.banner small{font-size:11px;color:var(--sub);align-self:flex-start}

/* ---- scene card (state change) ---- */
.scene{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:24px;background:rgba(40,37,54,.28);cursor:pointer}
.scard{background:var(--paper);border:1.5px solid var(--ink);border-radius:5px;box-shadow:4px 5px 0 var(--ink);padding:18px 20px;width:min(300px,100%);font-family:var(--f-head);animation:drop .35s cubic-bezier(.2,.9,.3,1.25);position:relative}
@keyframes drop{from{transform:translateY(-14px) rotate(-3deg);opacity:0}to{transform:rotate(-1deg);opacity:1}}
.scard .tag{display:inline-block;padding:2px 9px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.12em;transform:rotate(-3deg)}
.scard h3{margin:10px 0 4px;font-size:24px;font-weight:900;line-height:1.3}
.scard h3 span{position:relative;isolation:isolate}
.scard h3 span::after{content:"";position:absolute;z-index:-1;left:-2%;right:-2%;bottom:6%;height:28%;background:var(--pink);transform:rotate(-1.5deg)}
.scard.bad h3 span::after{background:#ffb3c1}
.scard.good h3 span::after{background:var(--lime)}
.scard p{margin:0;font-size:14px;line-height:1.7;color:var(--pmuted)}
.scard .hand{margin-top:10px;font-family:var(--f-hand);font-weight:600;font-size:13px;color:var(--ink)}

/* ---- overlays ---- */
.ov{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column}
.call{background:linear-gradient(180deg,#3b4a5e,#1a212c);color:#fff;align-items:center;justify-content:space-between;padding:64px 24px 48px;text-align:center}
.call .av{width:100px;height:100px;font-size:34px;margin:0 auto 14px;animation:pulse 1.2s infinite}
.call.live .av{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
.call h3{font-size:24px;margin:0}
.call p{color:#c6cdd8;margin:6px 0 0;font-size:13px;font-variant-numeric:tabular-nums}
.subs{min-height:120px;display:flex;flex-direction:column;gap:8px;justify-content:center;font-size:16px;line-height:1.5}
.subs .s{animation:pop .2s}
.cbtns{display:flex;gap:64px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-size:12px;color:#fff}
.cb i{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;color:#fff}
.cb.no i{background:var(--bad)} .cb.yes i{background:var(--brand)}
.osd{background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:24px}
.osbox{background:rgba(242,242,246,.98);border-radius:14px;width:min(290px,100%);text-align:center;overflow:hidden;color:#16181d}
.osbox .in{padding:18px 16px 14px}
.osbox b{display:block;font-size:16px;margin-bottom:6px}
.osbox p{margin:0;font-size:13px;color:#3f444d;line-height:1.5}
.osbox .bt{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d5d6db}
.osbox .bt.v{grid-template-columns:1fr}
.osbox .bt button{background:none;border:0;padding:12px;cursor:pointer;color:#0a64e0;font-size:15px}
.osbox .bt:not(.v) button+button{border-left:1px solid #d5d6db;font-weight:700}
.osbox .bt.v button+button{border-top:1px solid #d5d6db}
.dead{background:#000}
.viewer{background:#000;color:#fff}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.viewer .vh .av{width:32px;height:32px;font-size:12px;background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}
.viewer .vh b{flex:1;font-size:14px}
.viewer .vh button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.viewer .dots{display:flex;gap:4px;padding:0 14px 10px}

/* ---------------- messaging ---------------- */
function line(th,obj){obj.t=S.t;S.th[th].msgs.push(obj);S.th[th].lastT=S.t}
function sys(th,x){S.th[th].msgs.push({k:"sys",x:fill(x)});S.th[th].lastT=S.t;render()}
function fill(x){return String(x).replace(/\{oshi\}/g,S.oshi).replace(/\{block\}/g,S.block)}
function preview(o){return o.stamp?"スタンプを送信しました":o.photo?"写真を送信しました":o.post?o.post.title:o.x}
function them(th,lines,opts={}){const T=S.th[th];T.queue.push({lines:lines.slice(),opts});if(!T.busy) drain(th)}
function drain(th){
  const T=S.th[th],my=sid;
  const job=T.queue.shift();
  if(!job){T.busy=false;render();return}
  T.busy=true;
  const step=()=>{
    if(my!==sid||S.over) return;
    if(!job.lines.length){
      T.busy=false;
      if(job.opts.then) job.opts.then();
      render();
      if(T.queue.length&&!T.busy) drain(th);
      return;
    }
    T.typing=true;render();
    const raw=job.lines.shift();
    const isPair=Array.isArray(raw)&&th==="group";
    const txt=isPair?raw[1]:Array.isArray(raw)?"":raw;
    setTimeout(()=>{
      if(my!==sid||S.over) return;
      T.typing=false;
      let obj;
      if(isPair) obj={k:"them",who:raw[0],x:fill(raw[1])};
      else if(Array.isArray(raw)) obj={k:"them",stamp:raw};
      else obj={k:"them",x:fill(raw)};
      line(th,obj);
      T.last=(obj.who?obj.who+": ":"")+preview(obj);
      if(S.view!==th){T.unread++;S.m.notif++;banner(th,TH[th].name,T.last)}
      render();step();
    },Math.min(900+String(txt).length*65,2200)+Math.random()*400);
  };
  step();
}
function me(th,o){line(th,{k:"me",...o});S.th[th].last=preview(o);render()}
function setPending(th,choices,onPick){S.th[th].pending={choices:shuffle(choices),onPick};render()}
function answer(th,c){
  const T=S.th[th];if(!T.pending) return;
  const p=T.pending;T.pending=null;
  if(c.photo){S.m.photo++;me(th,{photo:c.photo})}
  else if(c.stamp) me(th,{stamp:c.stamp});
  else me(th,{x:fill(c.t)});
  p.onPick(c);
}
function endStamp(th,choices){setPending(th,choices,()=>{});S.th[th].pending.end=true}
const openQ=th=>{const P=S.th[th].pending;return P&&!P.end}

function later(fn,ms){const my=sid;setTimeout(()=>{if(my===sid&&S&&!S.over) fn()},ms)}

function gate(){
