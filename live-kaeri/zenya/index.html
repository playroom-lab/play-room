<body>
<div class="app" id="app">
  <div class="band" aria-label="ゲームの状態">
    <div class="srow">
      <div class="stat"><div class="lab"><span>ワクワク<em id="w_ex"></em></span><b id="v_ex"></b></div><div class="bar"><span id="b_ex"></span></div></div><div class="stat"><div class="lab"><span>スマホ電池<em id="w_bat"></em></span><b id="v_bat"></b></div><div class="bar"><span id="b_bat"></span></div></div>
      <div class="train"><small id="tkS"></small><b id="tkB"></b><i id="tkI"></i></div>
    </div>
    <button class="pinch" id="pinch" type="button" aria-expanded="false"><i id="pinchI">✓</i><span id="pinchT">いまのピンチはなし</span><small id="pinchN"></small></button>
    <div class="plist" id="plist" hidden=""></div>
    
    <div class="arow"><div class="stage" id="stage"><b>いま</b><span></span></div><span class="acts" id="acts"></span></div>
  </div>
  <div class="phone">
    <div class="sbar" id="sbar"><span id="clk"></span><span class="r"><span>4G</span><span class="bat" id="bat"><span id="batp"></span><i><b id="batb"></b></i></span></span></div>
    <div class="view" id="view"></div>
  </div>
  <button class="pa" id="pa" type="button" aria-live="polite"><i id="paI"></i><b id="paT"></b><span id="paX"></span></button>
  <div class="scene" id="scene" hidden=""></div>
  <div class="ov intro" id="intro"></div>
  <div class="ov call" id="call" hidden=""></div>
  <div class="ov osd" id="osd" hidden=""></div>
  <div class="ov result" id="result" hidden=""></div></div>
<script src="../../shared/chat-sim-v1.js"></script>
<script>
/* ライブ帰りシミュレーター 参戦前夜版 */
(function(){
const A=ChatSim.api;
const T=(h,m)=>h*60+m;
const START=T(22,0),GOAL=T(24,30),LATE=T(26,30);
const X=x=>({x,tag:"hype"});           // 読むとワクワクが上がる
const items=S=>(S.ticket?1:0)+(S.train?1:0)+(S.id?1:0)+(S.pen?1:0)+(S.towel?1:0)+(S.mb>=60?1:0);
const sleepH=(S,t)=>Math.max(0,(S.wake+24*60-(t||S.t))/60);
const hfmt=h=>(Math.round(h*10)/10).toFixed(1)+"時間";

const SCN={
  id:"lk-zenya",title:"ライブ前夜シミュレーター",start:START,speed:6000,
  fine:"フィクションです。登場する人物・会場・団体はすべて架空です。",
  clearNote:"いってらっしゃい。次は、ちがう夜で。",
  infoThread:"info",
  links:[["本編（ライブ帰り）","../"],["はるや版","../haruya/"],["すずさん版","../suzu/"]],
  threads:{
    group:{name:"明日の遠征組",short:"遠征組",col:"#5fbfa0",ini:"遠",n:3,group:1},
    mom:{name:"母",short:"母",col:"#e7b25e",ini:"母"},
    senpai:{name:"たかぎ先輩",short:"先輩",col:"#9aa0ab",ini:"た"},
    info:{name:"お知らせ",col:"#6b6680",ini:"!",static:1},
    zemi:{name:"バイト（ホール）",col:"#b2b7c2",ini:"バ",n:12,group:1,static:1,last:"店長: 来週のシフト出しておいてね",lastT:T(20,12),msgs:[{k:"them",who:"店長",x:"来週のシフト出しておいてね",t:T(20,12)}]}
  },
  order:["group","mom","senpai","info","zemi"],
  stats:[
    {key:"ex",label:"ワクワク",init:50,max:100,color:v=>v>=75?"#ff6b6b":v>=60?"#ffb84d":"var(--pink)",warn:v=>v>=75?" 寝られない":v>=60?" 高め":""},
    {key:"bat",label:"スマホ電池",init:30,max:100,color:v=>v<20?"#ff6b6b":v>=80?"var(--lime)":"var(--sky)",warn:v=>v>=80?" OK":""}
  ],
  init(S){
    S.wake=T(5,30);S.mb=15;S.plug="";S.charger=0;S.ticket=0;S.train=0;S.id=0;S.pen=0;S.penDead=Math.random()<.6;S.penChecked=0;S.towel=0;
    S.alarm=0;S.bath=0;S.milk=0;S.video=0;S.called=0;S.setlist=0;S.early=0;S.homeBatt=0;S.shopBatt=0;S.login=Math.random()<.4;S.loginFixed=0;S.lie=0;S.stretchT=0;S.wear=0;
    S.m.hype=0;
  },
  ticket(S){const h=sleepH(S);return {small:"いま寝たら",big:hfmt(h),sub:"アラーム "+A.fmt(S.wake),cls:h<4.5?"hot":""}},
  minute(S,api,n){
    if(n%6===0) api.change("ex",1);
    if(n%4===0&&!(S.plug==="phone"&&S.charger)) api.change("bat",-1);
    if(S.plug==="phone"&&S.charger) api.change("bat",1);
    if(S.plug==="mb"&&S.charger) S.mb=Math.min(100,S.mb+1);
    if(S.lie&&n%2===0){api.change("ex",-1)}
    if(S.lie&&S.t>=S.lieUntil){S.lie=0;api.end("phone")}
    if(S.t>=LATE&&!S.inBed) api.end("night");
  },
  onRead(S,api,th,msgs){
    let n=0;for(const m of msgs) if(m.tag==="hype") n++;
    if(!n) return;S.m.hype+=n;S.zz=(S.zz||0)+n*1.6;const z=Math.floor(S.zz);S.zz-=z;api.change("ex",z);
  },
  onStat(S,api,k){if(k==="bat"&&S.bat<=0&&!S.over){S.bat=0}},
  chase:{group:{ms:30000,max:2,lines:["おーい","もう寝た？笑"]}},
  alerts(S){
    const a=[];
    if(!S.charger) a.push({lv:2,x:"充電器が見当たらない"});
    else if(!S.plug) a.push({lv:2,x:"何も充電していない"});
    if(S.ex>=70) a.push({lv:3,x:"ワクワクしすぎて寝られなさそう"});
    if(S.bat<15) a.push({lv:3,x:"スマホの電池が残り"+S.bat+"%"});
    if(S.t>=T(23,30)&&!S.alarm) a.push({lv:2,x:"アラームをまだセットしていない"});
    if(S.alarm&&S.alarmAt!==S.wake) a.push({lv:3,x:"アラームが"+A.fmt(S.alarmAt)+"のまま（新幹線を早めた）"});
    const need=6-items(S);if(S.t>=T(23,0)&&need>0) a.push({lv:need>=3?2:1,x:"持ち物があと"+need+"つ"});
    if(S.t>=GOAL) a.push({lv:3,x:"寝る目標の0:30を過ぎた"});
    if(S.lie) a.push({lv:3,x:"ベッドでスマホを見ている"});
    return a;
  },
  stage(S){
    const acts=[];
    const ch=!S.charger?"充電器なし":S.plug==="phone"?"スマホ充電中":S.plug==="mb"?"モバイル充電中 "+S.mb+"%":"充電なし";
    const text=(S.lie?"ベッドでスマホ…":ch)+"・持ち物"+items(S)+"/6";
    if(S.lie){acts.push({label:"スマホを置く",pulse:1,on:()=>{S.lie=0;A.hud()}});return {text,acts}}
    acts.push({label:"やること",on:()=>doMenu(S)});
    if(!S.charger) acts.push({label:"充電器を探す",sub:1,pulse:1,on:()=>{S.charger=1;S.plug="phone";act(S,4,0,"充電器","リュックのポケットから出てきた。","とりあえずスマホを挿す")}});
    else acts.push({label:S.plug==="phone"?"モバイルを充電":"スマホを充電",sub:1,on:()=>{S.plug=S.plug==="phone"?"mb":"phone";A.scene("コンセント",S.plug==="phone"?"スマホを充電":"モバイルバッテリーを充電","コンセントはひとつだけ。","どっちも明日いる");A.hud()}});
    acts.push({label:"寝る",sub:S.t<T(23,45),pulse:S.t>=T(24,0),on:()=>goBed(S)});
    return {text,ready:S.t>=T(24,0),acts};
  },
  where(S){return {night:"ベッドの上",phone:"ベッドの上",sleepless:"天井の見える部屋",forgot:"新幹線のホーム"}[S.endKind]||"自分の部屋"},
  endOrder:["perfect","slept","forgot","alarm","sleepless","night","phone"],
  endings:{
    perfect:{name:"完璧な前夜",clear:1,text:"リュックの中身は全部そろって、スマホもモバイルバッテリーも満タン近く。アラームは{wake}。目を閉じたら、{name}のことを考える前に眠っていた。"},
    slept:{name:"ちゃんと寝られた",clear:1,text:"完璧じゃないけど、明日はなんとかなる。足りないものは現地で考える。{name}に会えるなら、それでいい。"},
    forgot:{name:"忘れ物の朝",text:"新幹線のホームで気づいた。ないものが、ある。遠征組に「ごめん…」と送る朝。{name}に会う前に、ひと仕事できた。"},
    alarm:{name:"アラームのない朝",text:"目が覚めたら、窓の外が明るすぎた。アラームをかけ忘れていた。遠征組から着信が12件。"},
    sleepless:{name:"眠れない夜",text:"{name}のことを考えるほど目が冴える。気づけば外が白んできた。寝不足のまま、それでも行く。"},
    night:{name:"夜ふかしの果て",black:1,text:"準備が終わらないまま2時半。明日の自分にすべてを託して、電気を消した。"},
    phone:{name:"スマホを握ったまま",black:1,text:"ちょっとだけのつもりでベッドでスマホを見ていたら、そのまま寝ていた。電気はつけっぱなし、アラームは…。"}
  },
  result(S,kind){
    const h=S.bedT?sleepH(S,S.bedT):0;
    return {
      ticket:["睡眠",hfmt(h)],
      checks:[["持ち物6つ",items(S)===6],["5時間寝た",h>=5&&kind!=="sleepless"],["電池80%",S.bat>=80]],
      big:{n:items(S),of:6,label:"持ち物（チケット・新幹線・身分証・ペンライト・タオル・モバイル充電）",short:"持ち物"},
      stats:[["睡眠",hfmt(h)],["ワクワク",String(S.ex)],["スマホ",S.bat+"%"],["モバイル",S.mb+"%"]],
      kv:[["寝た時刻",S.bedT?A.fmt(S.bedT):"—"],["アラーム",S.alarm?A.fmt(S.wake):"かけ忘れ"],["スマホ電池",S.bat+"%"],["モバイルバッテリー",S.mb+"%"],["ペンライト",S.pen?(S.shopBatt?"コンビニの電池で点いた":S.homeBatt?"家の電池で点いた":"点いた"):"未確認"],["読んだワクワク話",S.m.hype+"件"]]
    };
  },
  titles:[
    {id:"zen",name:"完璧な前夜の人",hint:"全部そろえて、6時間近く寝る",ok:(S,k)=>k==="perfect"&&sleepH(S,S.bedT)>=5.5},
    {id:"prep",name:"前日準備の鬼",hint:"完璧な前夜",ok:(S,k)=>k==="perfect"},
    {id:"alarm",name:"アラームは大事",hint:"大事なことを忘れる",ok:(S,k)=>k==="alarm"},
    {id:"phone",name:"握ったまま寝た人",hint:"ベッドでちょっとだけ",ok:(S,k)=>k==="phone"},
    {id:"sleepless",name:"眠れぬ夜のオタク",hint:"ワクワクしすぎる",ok:(S,k)=>k==="sleepless"},
    {id:"night",name:"夜ふかしの人",hint:"準備が終わらない",ok:(S,k)=>k==="night"},
    {id:"forgot",name:"忘れ物は現地調達",hint:"持ち物が足りない",ok:(S,k)=>k==="forgot"},
    {id:"chi",name:"みんなの目覚まし",hint:"寝坊しそうな子を引き受ける",ok:S=>S.chi},
    {id:"call",name:"前夜祭通話",hint:"遠征組と通話する",ok:S=>S.called},
    {id:"video",name:"映像で予習した人",hint:"過去のライブ映像を見る",ok:S=>S.video},
    {id:"setlist",name:"セトリ予想班",hint:"予想に乗る",ok:S=>S.setlist},
    {id:"early",name:"1本早い新幹線",hint:"運行情報に備える",ok:S=>S.early},
    {id:"shop",name:"深夜のコンビニ電池",hint:"ペンライトが点かない",ok:S=>S.shopBatt},
    {id:"milk",name:"ホットミルクの人",hint:"落ち着く飲み物",ok:S=>S.milk},
    {id:"normal",name:"いつもの前夜",hint:"いつもの夜",ok:()=>true}
  ],
  intro:{
    tag:"参戦前夜版",h1:"ライブ<span>前夜</span>シミュレーター",note:"明日は遠征。アラームは5:30。",
    ticket:["ALARM","5:30"],storyLabel:"今夜のわたし",
    story:"22時、自分の部屋。明日は新幹線で遠征して、推しのライブ。<br>持ち物はまだ半分、スマホの電池は30%、充電器はどこかへ行った。遠征組のグループは、もう盛り上がっている。",
    goal:"持ち物をそろえて、充電して、アラームをかけて寝る。",
    goalSub:"0:30までに寝られると、5時間寝られる。",
    how:[["ワクワク","✨の話を読むと上がる。高いと寝られない"],["充電","コンセントはひとつ。スマホかモバイルバッテリー"],["持ち物","「やること」でそろえる。6つ"],["寝る","アラームを忘れずに。上のボタンで寝る"]],
    field:{tag:"推し",label:"推しの名前",def:"推し",short:"推し"},
    button:"準備をはじめる"
  },
  events:[
    {at:START,f:(S,api)=>api.ask("group",[["みか","明日！！！"],["さや","寝れる気しない"],["みか","{name}に会える…"]],[
      {t:"わかる、もうドキドキしてる",fx:{ex:5},r:[["さや","心臓もたない"]]},
      {t:"ちゃんと寝ようね",fx:{ex:-2},r:[["みか","えらい"],["さや","寝れたらね笑"]]},
      {stamp:["🎉","ぱーてぃー"],fx:{ex:3},r:[["みか","気が早い笑"]]}])},
    {at:START+2,f:(S,api)=>api.scene("22:00","充電器がない","スマホは30%。いつもの場所に充電器がない。","上の「充電器を探す」")},
    {at:T(22,10),f:(S,api)=>api.info("ホテル予約","明日のご予約：チェックイン15:00〜。")},
    {at:T(22,14),f:(S,api)=>api.ask("group",[["さや","集合は新宿駅7:00ね"],["さや","新幹線7:24、5号車"]],[
      {t:"了解！",r:[["さや","遅刻したら置いてく笑"]]},
      {t:"切符もう送ってくれた？",r:[["さや","アプリに入ってるはず！確認して"]]},
      {stamp:["🫡","了解"],r:[]}])},
    {at:T(22,20),f:(S,api)=>api.ask("mom",["明日何時に出るの？","タオル洗ってソファに置いといたよ","早く寝なさいよ"],[
      {t:"6時すぎ。もう寝る",r:["本当に？"]},
      {t:"準備したら寝る",r:["準備まだなの…"]},
      {stamp:["🙆","OK"],r:["スタンプだけ…"]}])},
    {at:T(22,25),f:(S,api)=>api.ask("group",[["みか","ねえ明日の座席みんなどこ？"],["みか","見せて見せて"]],[
      {t:"（チケット画面をスクショして送る）",act:1,photo:"ticket",cost:"スマホ電池−2",on:(S,api)=>{api.change("bat",-2);if(S.login&&!S.loginFixed){S.loginFixed=1;api.addTime(3);api.scene("ログイン","パスワードが違います","チケットアプリが開かない。再設定して3分。","…ここで！？")}S.ticket=1},r:[X("待って近くない？"),X("{name}の花道の横じゃん"),["さや","勝ち確"]]},
      {t:"あとで送る！",r:[["みか","はやく〜"]]},
      {stamp:["🎫","チケット"],fx:{ex:1},r:[["みか","スタンプじゃわからん笑"]]}])},
    {at:T(22,30),f:(S,api)=>api.info("天気","明日の遠征先：午後から雨。折りたたみ傘があると安心です","rain")},
    {at:T(22,38),f:(S,api)=>api.ask("group",[["みか","ねえセトリ予想しよ"],X("1曲目絶対あれでしょ")],[
      {t:"しよ！1曲目はあれ",fx:{ex:6},on:S=>S.setlist=1,r:[X("やっぱり？"),X("{name}のソロどこに入ると思う？")],after:()=>api.later(()=>api.ask("group",[["さや","じゃあ最後の曲は？"]],[
        {t:"いちばん盛り上がるやつで締める",fx:{ex:4},r:[X("天才"),X("想像しただけで泣ける")]},
        {t:"静かな曲でしっとり終わる",fx:{ex:3},r:[X("それもいい…"),["みか","タオル用意しとこ"]]},
        {t:"予想は外れたほうが楽しい",fx:{ex:-1},r:[["さや","大人だ"],["みか","でも当てたい"]]}]),1200)},
      {t:"予想すると寝れなくなる",fx:{ex:-1},r:[["さや","正論"],["みか","でもする"],X("1曲目はあれ！以上！")]},
      {stamp:["🔮","よげん"],fx:{ex:3},on:S=>S.setlist=1,r:[X("占い師きた"),X("当たったら神")]}])},
    {at:T(22,50),f:(S,api)=>api.ask("senpai",["夜にごめん","明日休みだよね？","1個だけ資料の場所教えてほしい"],[
      {t:"共有フォルダの「月次」です",cost:"5分",on:S=>{A.addTime(5)},r:["助かった！","楽しんできてね"]},
      {t:"明日休みなので戻ったら見ます",r:["そうだよね、ごめん！"]},
      {stamp:["🙏","ごめんなさい"],r:["了解、いってらっしゃい"]}])},
    {at:T(23,0),f:(S,api)=>api.ask("group",[["さや","ねえ前夜祭しない？"],["さや","ちょっとだけ通話"]],[
      {t:"する！",fx:{ex:4},on:S=>S.callYes=1,r:[["さや","かけるね"]]},
      {t:"準備終わってない…",r:[["さや","了解、がんばれ"]]},
      {t:"寝る前にちょっとだけなら",on:S=>S.callYes=1,r:[["さや","10分ね！"]]}])},
    {at:T(23,3),f:(S,api)=>{if(S.callYes) api.incoming("group",{label:"グループ音声通話",lines:["もしもし〜！","明日やばくない？","{name}の髪色予想しよ","…それは明日のお楽しみ","じゃあ寝よ！おやすみ！"],cost:10,onEnd:()=>{S.called=1;api.change("ex",12);api.change("bat",-3)},onDecline:()=>later(()=>api.them("group",[["さや","あれ、寝た？"]]),1200)})}},
    {at:T(23,10),f:(S,api)=>{api.info("運行情報","明日朝、強風の影響で一部列車に遅れが出る可能性があります");later(()=>api.ask("group",[["みか","運行情報見た？"],["みか","1本早いのにする？6:50"]],[
      {t:"早いのにしよ",on:S=>{S.early=1;S.wake=T(5,0)},r:[["みか","アラーム5時ね！"]]},
      {t:"たぶん大丈夫",r:[["さや","祈ろ"]]},
      {stamp:["🙏","いのる"],r:[["みか","いのる"]]}]),2500)}},
    {at:T(22,46),f:(S,api)=>api.ask("group",[["ちー","やっと仕事終わった😭"],["ちー","明日寝坊したら電話して"],["ちー","ほんとに"]],[
      {t:"任せて、6時に電話する",on:S=>S.chi=1,r:[["ちー","神"],["みか","優しすぎる"]]},
      {t:"自分で起きて笑",r:[["ちー","はい…"],["さや","起きろよ"]]},
      {stamp:["⏰","めざまし"],on:S=>S.chi=1,r:[["ちー","たよりにしてる"]]}])},
    {at:T(23,15),f:(S,api)=>{if(!S.id) api.them("group",[["さや","あ、明日身分証チェックあるって"],["さや","財布入れた？"]])}},
    {at:T(23,30),f:(S,api)=>api.them("group",[X("{name}の夢見れますように"),["さや","おやすみ〜"]])},
    {at:T(23,38),f:(S,api)=>api.ask("group",[["みか","ねえ明日のコーデ見せ合お"],X("{name}のグッズどこに付けてく？")],[
      {t:"（服の写真を送る）",act:1,photo:"outfit",cost:"スマホ電池−2",fx:{ex:3,bat:-2},on:S=>S.wear=1,r:[X("かわいい！！"),X("缶バッジの付け方わかってる"),["ちー","優勝"]]},
      {t:"明日のお楽しみ",r:[["みか","焦らすじゃん"]]},
      {stamp:["👗","ひみつ"],r:[["さや","気になる"]]}])},
    {at:T(23,50),f:(S,api)=>api.them("mom",["まだ起きてる？","既読ついてるよ"])},
    {at:T(24,10),f:(S,api)=>api.ask("group",[["みか","寝た？"],["みか","私寝れない"],X("{name}のこと考えちゃう")],[
      {t:"寝る！おやすみ",r:[["みか","おやすみ…"]]},
      {t:"わかる、私も",fx:{ex:4},r:[X("でしょ"),X("明日の今ごろ終わってるんだよ")]},
      {stamp:["😴","おやすみ"],r:[["みか","おやすみ！"]]}])},
    {at:T(25,0),f:(S,api)=>api.info("時計","1:00です。アラームまであと"+hfmt(sleepH(S)))}
  ],
  fillers:[
    {th:"group",lines:[X("明日の{name}の衣装なにかな"),["さや","新衣装来てほしい"]]},
    {th:"group",lines:[["みか","服決まった？"]],choices:[{t:"いま迷ってる",r:[["みか","わかる"]]},{t:"決まった！",on:S=>S.wear=1,r:[["みか","えらい"]]},{stamp:["👗","まよう"],r:[["さや","かわいい"]]}]},
    {th:"group",lines:[["さや","新幹線でお菓子食べよ"],["みか","じゃがりこ持ってく"]]},
    {th:"group",lines:[X("前回の{name}のあれ思い出した"),X("むり")]},
    {th:"group",lines:[["さや","ペンライトの電池確認した？"],["さや","前回切れたんだよね"]]},
    {th:"group",lines:[["みか","モバ充、充電しといてね"],["みか","ホテルのコンセント少ないから"]]},
    {th:"group",lines:[X("{name}がこっち見たらどうしよ"),["さや","見ないよ"],["みか","見るよ"]]},
    {th:"group",lines:[["さや","ホテルの近くにおいしいパン屋あるらしい"]]},
    {th:"mom",lines:["お土産はいらないからね","気をつけて"]},
    {th:"mom",lines:["冷蔵庫にプリンあるよ"]},
    {th:"senpai",lines:["さっきはありがとう","いい夜を"],when:S=>S.t>T(23,0)},
    {th:"info",f:(S,api)=>api.info("ニュース","明日の朝は冷え込みます。最低気温9℃")},
    {th:"info",f:(S,api)=>api.info("新幹線アプリ","明日 7:24発 のぞみ（5号車）のQRチケットがあります"),when:S=>!S.train},
    {th:"info",f:(S,api)=>api.info("フリマアプリ","「{name} ペンライト」に新着が3件")},
    {th:"info",f:(S,api)=>api.info("スマホ","バッテリー残量が少なくなっています"),when:S=>S.bat<20}
  ],
  fill(S,s){return s.replace(/\{wake\}/g,A.fmt(S.wake))}
};

function later(fn,ms){A.later(fn,ms)}
function act(S,min,ex,title,body,hand){S.lie=0;A.scene(min+"分",title,body,hand);A.addTime(min);if(ex)A.change("ex",ex);A.hud()}
function doMenu(S){
  const it=[];
  it.push({label:"電子チケットを表示する",short:"チケット",done:S.ticket,sub:"2分・スマホ電池−2",on:()=>{A.change("bat",-2);
    if(S.login&&!S.loginFixed){S.loginFixed=1;act(S,2,3,"ログイン","「パスワードが違います」。","…ここで！？　再設定してもう一回");return}
    S.ticket=1;act(S,2,2,"チケット","明日の座席、ちゃんと表示された。","スクショも撮っておく")}});
  it.push({label:"新幹線の切符を確認",short:"新幹線",done:S.train,sub:"2分",on:()=>{S.train=1;act(S,2,1,"新幹線","アプリにQRが入っている。","7:24発、5号車")}});
  it.push({label:"財布と身分証を入れる",short:"身分証",done:S.id,sub:"1分",on:()=>{S.id=1;act(S,1,0,"財布","身分証、ある。","本人確認があっても大丈夫")}});
  it.push({label:"ペンライトを点ける",short:"ペンライト",done:S.pen,sub:S.penChecked&&S.penDead?"電池が切れている":"2分",disabled:S.penChecked&&S.penDead,on:()=>{S.penChecked=1;if(S.penDead){act(S,2,0,"ペンライト","…点かない。","電池が切れてる")}else{S.pen=1;act(S,2,3,"ペンライト","ちゃんと光った。","明日これを振る")}}});
  if(S.penChecked&&S.penDead&&!S.pen){
    it.push({label:"家の電池を探す",short:"電池探し",done:S.searched,sub:"5分・あるかは運",on:()=>{S.searched=1;if(Math.random()<.5){S.pen=1;S.homeBatt=1;act(S,5,0,"電池","リモコンの横に新品が2本。","ペンライトが点いた")}else act(S,5,0,"電池","引き出しを全部開けた。ない。","コンビニかな…")}});
    it.push({label:"コンビニで電池を買う",sub:"15分",on:()=>{S.pen=1;S.shopBatt=1;act(S,15,-6,"コンビニ","夜風にあたって少し落ち着いた。","ついでにおにぎりも")}});
  }
  it.push({label:S.t>=T(22,20)?"ソファのタオルを入れる":"タオルを入れる",short:"タオル",done:S.towel,sub:S.t>=T(22,20)?"1分・お母さんが洗ってくれた":"2分",on:()=>{S.towel=1;act(S,S.t>=T(22,20)?1:2,2,"タオル","いちばんお気に入りのタオル。","明日これを掲げる")}});
  it.push({label:"アラームをセット",short:"アラーム "+A.fmt(S.wake),done:S.alarm&&S.alarmAt===S.wake,sub:S.alarm?A.fmt(S.alarmAt)+"のまま。"+A.fmt(S.wake)+"にかけ直す・1分":"1分",on:()=>{S.alarm=1;S.alarmAt=S.wake;act(S,1,0,"アラーム",A.fmt(S.wake)+"、5分おきに3つ。","これで安心")}});
  it.push({label:"お風呂に入る",short:"お風呂",done:S.bath,sub:"20分・ワクワク−15",on:()=>{S.bath=1;act(S,20,-15,"お風呂","湯船につかると、肩の力が抜けた。","明日にそなえる")}});
  it.push({label:"ホットミルクを飲む",short:"ホットミルク",done:S.milk,sub:"5分・ワクワク−8",on:()=>{S.milk=1;act(S,5,-8,"ホットミルク","はちみつを少し。","ほっとする")}});
  it.push({label:"ストレッチ",sub:S.t<S.stretchT?"さっきやった":"3分・ワクワク−4",disabled:S.t<S.stretchT,on:()=>{S.stretchT=S.t+20;act(S,3,-4,"ストレッチ","深呼吸しながら背中をのばす。","")}});
  it.push({label:"過去のライブ映像を見る",sub:"20分・ワクワク+15",on:()=>{S.video=1;act(S,20,15,"予習","あのときの{name}。何度見てもいい。","…目が冴えてきた")}});
  it.push({label:"ベッドでスマホを見る",sub:"ちょっとだけ",on:()=>{S.lie=1;S.lieUntil=S.t+A.rnd(12,20);A.scene("ベッド","ちょっとだけ","横になってタイムラインを眺める。","明日の準備は、あとで…")}});
  A.menu("やること","時間がたつ間も、メッセージは届く。",it);
}
function goBed(S){
  const miss=[];if(!S.alarm||S.alarmAt!==S.wake) miss.push("アラーム");if(items(S)<6) miss.push("持ち物 あと"+(6-items(S))+"つ");if(S.bat<80) miss.push("スマホ "+S.bat+"%");
  A.confirmBox("寝る？",miss.length?"まだ："+miss.join("・"):"準備は全部できた。","寝る","まだ",()=>{
    S.bedT=S.t;S.inBed=1;S.lie=0;let awake=0;
    while(S.ex>=60&&S.t<T(27,0)){A.addTime(20);if(S.over)return;S.ex=Math.max(0,S.ex-10);awake+=20}
    S.bedT=S.t;S.awake=awake;
    if(!S.alarm||S.alarmAt!==S.wake) return A.end("alarm");
    if(awake>=60) return A.end("sleepless");
    if(!S.ticket||!S.train||!S.id||items(S)<4) return A.end("forgot");
    if(items(S)===6&&sleepH(S,S.bedT)>=5&&S.bat>=80) return A.end("perfect");
    if(sleepH(S,S.bedT)>=3.5) return A.end("slept");
    A.end("sleepless");
  });
}
window.ZENYA=SCN;
})();
ChatSim.start(window.ZENYA);
</script>
